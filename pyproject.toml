[project]
name = "nlp100"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate>=1.4.0",
    "certifi==2022.5.18.1",
    "charset-normalizer==2.0.12",
    "cycler==0.11.0",
    "datasets==4.7.0",
    "filelock==3.7.0",
    "fonttools==4.33.3",
    "gensim==4.2.0",
    "google-genai>=2.6.0",
    "idna==3.3",
    "joblib==1.1.0",
    "kiwisolver==1.4.2",
    "matplotlib==3.5.2",
    "mecab-python3==1.0.5",
    "numpy==1.22.4",
    "packaging==21.3",
    "pandas==1.4.2",
    "pillow==9.1.1",
    "pyparsing==3.0.9",
    "python-dateutil==2.8.2",
    "python-dotenv>=1.2.2",
    "pytz==2022.1",
    "pyyaml==6.0",
    "regex==2022.4.24",
    "requests>=2.28.1",
    "sacrebleu>=2.6.0",
    "sacremoses>=0.1.1",
    "scikit-learn==1.1.1",
    "scipy==1.8.1",
    "six==1.16.0",
    "smart-open==6.0.0",
    "threadpoolctl==3.1.0",
    "torch==2.7.1",
    "tqdm>=4.66.3",
    "transformers==4.56.2",
    "trl==1.8.0",
    "typing-extensions>=4.11.0",
    "unidic-lite>=1.0.8",
    "urllib3==1.26.9",
]

[project.optional-dependencies]
cabocha = [
    "cabocha-python==0.69.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
